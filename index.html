<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIGHTYWISH的传奇经历</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080d;
      --panel: rgba(13, 15, 22, 0.78);
      --panel-strong: rgba(18, 20, 31, 0.94);
      --text: #f5f1ea;
      --muted: #b8b0a6;
      --red: #c23a4d;
      --ice: #64d7d2;
      --gold: #d6a84e;
      --line: rgba(255, 255, 255, 0.14);
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(140deg, rgba(194, 58, 77, 0.2), transparent 34%),
        linear-gradient(28deg, rgba(100, 215, 210, 0.14), transparent 42%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 78px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 78px),
        #07080d;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.24), transparent 34%, rgba(0, 0, 0, 0.46)),
        repeating-linear-gradient(115deg, transparent 0 14px, rgba(255, 255, 255, 0.018) 14px 15px);
      mix-blend-mode: screen;
      opacity: 0.62;
      z-index: -1;
    }

    a {
      color: inherit;
    }

    .site-shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 52px;
    }

    .top-hero {
      position: relative;
      min-height: 330px;
      display: grid;
      align-items: end;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      isolation: isolate;
      background-color: #11131b;
    }

    .top-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(7, 8, 13, 0.95) 0%, rgba(7, 8, 13, 0.7) 42%, rgba(7, 8, 13, 0.2) 100%),
        url("assets/photos/nightwish-12-large.webp");
      background-position: center;
      background-size: cover;
      filter: saturate(0.95) contrast(1.08);
      z-index: -2;
    }

    .top-hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 40%;
      background: linear-gradient(180deg, transparent, rgba(7, 8, 13, 0.94));
      z-index: -1;
    }

    .hero-content {
      padding: 36px;
      max-width: 760px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--ice);
      font-size: 13px;
      letter-spacing: 0;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 74px);
      line-height: 0.96;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
    }

    .intro {
      margin: 16px 0 0;
      max-width: 650px;
      color: #e7dfd5;
      line-height: 1.8;
      font-size: 16px;
    }

    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: rgba(7, 8, 13, 0.5);
      border-radius: 999px;
      color: #fff7ea;
      font-size: 13px;
      backdrop-filter: blur(10px);
    }

    .page-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: end;
      margin: 34px 0 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .chapter-kicker {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
    }

    .page-title {
      margin: 0;
      font-size: clamp(24px, 5vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .page-copy {
      margin: 10px 0 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.85;
      font-size: 15px;
    }

    .counter {
      min-width: 104px;
      padding: 12px 14px;
      border: 1px solid rgba(100, 215, 210, 0.28);
      border-radius: 8px;
      background: rgba(100, 215, 210, 0.08);
      color: var(--ice);
      text-align: center;
      font-weight: 800;
      font-size: 22px;
    }

    .counter span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      min-height: 520px;
    }

    .photo-card {
      position: relative;
      min-width: 0;
      aspect-ratio: 4 / 5;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel-strong);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.26);
      cursor: pointer;
      transform: translateY(0);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .photo-card:nth-child(3n + 1) {
      aspect-ratio: 1 / 1;
    }

    .photo-card:nth-child(4n + 2) {
      aspect-ratio: 5 / 4;
    }

    .photo-card:hover,
    .photo-card:focus-visible {
      outline: none;
      transform: translateY(-4px);
      border-color: rgba(100, 215, 210, 0.55);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(0.92) contrast(1.06);
      transform: scale(1.02);
      transition: transform 260ms ease, filter 260ms ease;
      background: #141821;
    }

    .photo-card:hover img,
    .photo-card:focus-visible img {
      transform: scale(1.07);
      filter: saturate(1.08) contrast(1.1);
    }

    .photo-meta {
      position: absolute;
      inset: auto 0 0;
      padding: 34px 12px 12px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.88));
      color: #fff;
      line-height: 1.35;
    }

    .photo-meta strong {
      display: block;
      font-size: 14px;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .photo-meta span {
      display: block;
      margin-top: 4px;
      color: #cfc7bd;
      font-size: 12px;
    }

    .pagination-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 30px 0 6px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(10, 12, 18, 0.64);
      backdrop-filter: blur(14px);
    }

    .page-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .page-btn:hover,
    .page-btn:focus-visible {
      outline: none;
      transform: translateY(-2px);
      border-color: rgba(214, 168, 78, 0.55);
      background: rgba(214, 168, 78, 0.13);
    }

    .page-btn.active {
      color: #12090b;
      border-color: transparent;
      background: linear-gradient(135deg, var(--gold), #f4df9d);
    }

    .source-note {
      margin: 16px auto 0;
      max-width: 820px;
      color: #938b81;
      text-align: center;
      line-height: 1.7;
      font-size: 12px;
    }

    .source-note a {
      color: #d8c18a;
      text-decoration: none;
      border-bottom: 1px solid rgba(216, 193, 138, 0.35);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.86);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-inner {
      position: relative;
      width: min(1120px, 100%);
      max-height: 92vh;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #05060a;
      box-shadow: var(--shadow);
    }

    .lightbox img {
      width: 100%;
      max-height: calc(92vh - 70px);
      display: block;
      object-fit: contain;
      background: #05060a;
    }

    .lightbox-caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      min-height: 60px;
      padding: 14px 16px;
      color: #e9e1d8;
      background: rgba(12, 14, 20, 0.96);
      line-height: 1.4;
      font-size: 14px;
    }

    .close-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .close-btn:hover,
    .close-btn:focus-visible {
      outline: none;
      border-color: rgba(194, 58, 77, 0.7);
      background: rgba(194, 58, 77, 0.22);
    }

    @media (max-width: 980px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .site-shell {
        width: min(100% - 20px, 560px);
        padding-top: 12px;
      }

      .top-hero {
        min-height: 430px;
      }

      .top-hero::before {
        background-image:
          linear-gradient(180deg, rgba(7, 8, 13, 0.15) 0%, rgba(7, 8, 13, 0.76) 56%, rgba(7, 8, 13, 0.98) 100%),
          url("assets/photos/nightwish-12-large.webp");
        background-position: center top;
      }

      .hero-content {
        padding: 24px 18px;
      }

      h1 {
        font-size: clamp(35px, 11vw, 52px);
      }

      .intro {
        font-size: 14px;
      }

      .page-head {
        grid-template-columns: 1fr;
        margin-top: 26px;
      }

      .counter {
        width: 110px;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        min-height: 860px;
      }

      .photo-meta {
        padding: 26px 10px 10px;
      }

      .photo-meta strong {
        font-size: 13px;
      }

      .pagination-wrap {
        gap: 8px;
        padding: 14px 10px;
      }

      .page-btn {
        width: 42px;
        height: 42px;
      }
    }

    @media (max-width: 390px) {
      .gallery {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .photo-card,
      .photo-card:nth-child(3n + 1),
      .photo-card:nth-child(4n + 2) {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="top-hero">
      <div class="hero-content">
        <p class="eyebrow">Finnish Symphonic Metal Gallery</p>
        <h1>NIGHTYWISH的传奇经历</h1>
        <p class="intro">
          从北欧小城的幻想旋律，到世界舞台上管弦、金属与歌剧嗓音交织的巨响。这里把 Nightwish 的舞台瞬间整理成 5 页照片展，像翻一本暗色调的巡演相册。
        </p>
        <div class="stat-row" aria-label="网站信息">
          <span class="stat">50 张照片</span>
          <span class="stat">5 页分页</span>
          <span class="stat">手机适配</span>
          <span class="stat">点击图片放大</span>
        </div>
      </div>
    </header>

    <main>
      <section class="page-head" aria-live="polite">
        <div>
          <p class="chapter-kicker" id="chapterKicker">Chapter 01</p>
          <h2 class="page-title" id="pageTitle">北境开篇</h2>
          <p class="page-copy" id="pageCopy"></p>
        </div>
        <div class="counter" id="counter">01<span>/ 05</span></div>
      </section>

      <section class="gallery" id="gallery" aria-label="Nightwish 照片展示"></section>

      <nav class="pagination-wrap" id="pagination" aria-label="选择页码"></nav>

      <p class="source-note">
        图片来自 Wikimedia Commons 的
        <a href="https://commons.wikimedia.org/wiki/Category:Nightwish" target="_blank" rel="noopener">Nightwish</a>、
        <a href="https://commons.wikimedia.org/wiki/Category:Nightwish_-_Wacken_Open_Air_2018" target="_blank" rel="noopener">Wacken Open Air 2018</a>
        和
        <a href="https://commons.wikimedia.org/wiki/Category:Nightwish_-_Accor_Arena_de_Paris_2022" target="_blank" rel="noopener">Accor Arena de Paris 2022</a>
        分类；具体许可请以每张图片的 Commons 文件页为准。
      </p>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="lightbox-inner">
      <img id="lightboxImg" src="" alt="" />
      <div class="lightbox-caption">
        <span id="lightboxText"></span>
        <button class="close-btn" id="closeBtn" type="button" aria-label="关闭预览">×</button>
      </div>
    </div>
  </div>

  <script>
    const pages = [
      {
        kicker: "Chapter 01",
        title: "北境开篇",
        copy: "Nightwish 诞生于芬兰，气质里一直有冰湖、森林与长夜的颜色。早期与成员合照放在第一章，先让这段传奇从人物本身开始。",
        label: "乐队记忆",
        photos: [
          "Nightwish au Rockhal 2015.JPG",
          "Nightwish backstage2007.jpg",
          "Nightwish with Tarja Turunen.jpg",
          "Nightwish with Anette and Marco.jpg",
          "Anette Marco Nightwish.jpg",
          "Edit (149617737).jpeg",
          "Symfobia so skupinou Nightwish.jpg",
          "Tuomas Holopainem em Sessão de autógrafos.jpg",
          "Nightwish em sessão de autógrafos.jpg",
          "Anette Olzon do Nightwish em sessão de autógrafos-3.jpg"
        ]
      },
      {
        kicker: "Chapter 02",
        title: "Wacken 的火焰",
        copy: "第二章进入大型音乐节的狂热现场。Wacken 的照片有开阔舞台、灯火与人群，很适合做暗黑风格网站的主视觉。",
        label: "Wacken 2018",
        photos: [
          "Nightwish - End of All Hope.jpg",
          "Nightwish - Wacken Open Air 2018-1650.jpg",
          "Nightwish - Wacken Open Air 2018-1653.jpg",
          "Nightwish - Wacken Open Air 2018-1662.jpg",
          "Nightwish - Wacken Open Air 2018-1673.jpg",
          "Nightwish - Wacken Open Air 2018-1679.jpg",
          "Nightwish - Wacken Open Air 2018-1685.jpg",
          "Nightwish - Wacken Open Air 2018-1704.jpg",
          "Nightwish - Wacken Open Air 2018-1716.jpg",
          "Nightwish - Wacken Open Air 2018-1724.jpg"
        ]
      },
      {
        kicker: "Chapter 03",
        title: "交响金属的巨浪",
        copy: "这一页继续用 Wacken 现场照，强调 Nightwish 最迷人的地方：金属的重量、管弦的史诗感，以及主唱把旋律推向天幕的瞬间。",
        label: "史诗现场",
        photos: [
          "Nightwish - Wacken Open Air 2018-1747.jpg",
          "Nightwish - Wacken Open Air 2018-1769.jpg",
          "Nightwish - Wacken Open Air 2018-3592.jpg",
          "Nightwish - Wacken Open Air 2018-3599.jpg",
          "Nightwish - Wacken Open Air 2018-3663.jpg",
          "Nightwish - Wacken Open Air 2018-3667.jpg",
          "Nightwish - Wacken Open Air 2018-3699.jpg",
          "Nightwish - Wacken Open Air 2018-3708.jpg",
          "Nightwish - Wacken Open Air 2018-3712.jpg",
          "Nightwish - Wacken Open Air 2018-3739.jpg"
        ]
      },
      {
        kicker: "Chapter 04",
        title: "巴黎夜航",
        copy: "2022 年巴黎 Accor Arena 的照片更像一场暗夜航行：冷光、红色舞台、剪影和烟雾，让页面有电影海报一样的气氛。",
        label: "Paris 2022",
        photos: [
          "Nightwish à Paris (204526).jpg",
          "Nightwish à Paris (204708).jpg",
          "Nightwish à Paris (204853).jpg",
          "Nightwish à Paris (205409).jpg",
          "Nightwish à Paris (205446).jpg",
          "Nightwish à Paris (205831).jpg",
          "Nightwish à Paris (210207).jpg",
          "Nightwish à Paris (210718).jpg",
          "Nightwish à Paris (210723).jpg",
          "Nightwish à Paris (211004).jpg"
        ]
      },
      {
        kicker: "Chapter 05",
        title: "传奇仍在回响",
        copy: "最后一页保留舞台余温。Nightwish 的传奇感，不只是某一首歌或某一任成员，而是二十多年里持续扩张的幻想世界。",
        label: "余响",
        photos: [
          "Nightwish à Paris (211230).jpg",
          "Nightwish à Paris (211439).jpg",
          "Nightwish à Paris (211832).jpg",
          "Nightwish à Paris (211903).jpg",
          "Nightwish à Paris (211906).jpg",
          "Nightwish à Paris (212509).jpg",
          "Nightwish à Paris (212513).jpg",
          "Nightwish à Paris (212857).jpg",
          "Nightwish à Paris (212940).jpg",
          "Nightwish à Paris (213522).jpg"
        ]
      }
    ];

    const gallery = document.querySelector("#gallery");
    const pagination = document.querySelector("#pagination");
    const chapterKicker = document.querySelector("#chapterKicker");
    const pageTitle = document.querySelector("#pageTitle");
    const pageCopy = document.querySelector("#pageCopy");
    const counter = document.querySelector("#counter");
    const lightbox = document.querySelector("#lightbox");
    const lightboxImg = document.querySelector("#lightboxImg");
    const lightboxText = document.querySelector("#lightboxText");
    const closeBtn = document.querySelector("#closeBtn");
    let currentPage = 0;

    const allPhotoFiles = pages.flatMap((page) => page.photos);

    function filePath(file, width = 980) {
      const photoIndex = allPhotoFiles.indexOf(file);
      if (photoIndex === -1) {
        return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}?width=${width}`;
      }

      const id = String(photoIndex + 1).padStart(2, "0");
      const size = width >= 1200 ? "large" : "thumb";
      return `assets/photos/nightwish-${id}-${size}.webp`;
    }

    function filePage(file) {
      return `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(file).replace(/%20/g, "_")}`;
    }

    function renderPagination() {
      pagination.innerHTML = "";
      pages.forEach((_, index) => {
        const button = document.createElement("button");
        button.className = `page-btn${index === currentPage ? " active" : ""}`;
        button.type = "button";
        button.textContent = index + 1;
        button.setAttribute("aria-label", `第 ${index + 1} 页`);
        button.addEventListener("click", () => showPage(index, true));
        pagination.appendChild(button);
      });
    }

    function showPage(index, shouldScroll = false) {
      currentPage = Math.max(0, Math.min(index, pages.length - 1));
      const page = pages[currentPage];
      chapterKicker.textContent = page.kicker;
      pageTitle.textContent = page.title;
      pageCopy.textContent = page.copy;
      counter.innerHTML = `${String(currentPage + 1).padStart(2, "0")}<span>/ 05</span>`;
      gallery.innerHTML = "";

      page.photos.forEach((file, photoIndex) => {
        const button = document.createElement("button");
        button.className = "photo-card";
        button.type = "button";
        button.setAttribute("aria-label", `打开图片：${file}`);

        const img = document.createElement("img");
        img.src = filePath(file, 900);
        img.alt = `${page.label} - Nightwish 照片 ${photoIndex + 1}`;
        img.width = 560;
        img.height = 700;
        img.decoding = "async";
        img.loading = currentPage === 0 && photoIndex < 2 ? "eager" : "lazy";
        img.fetchPriority = currentPage === 0 && photoIndex < 2 ? "high" : "low";

        const meta = document.createElement("div");
        meta.className = "photo-meta";
        meta.innerHTML = `<strong>${page.label} · ${photoIndex + 1}</strong><span>点击放大查看</span>`;

        button.append(img, meta);
        button.addEventListener("click", () => openLightbox(file, `${page.label} · 第 ${photoIndex + 1} 张`));
        gallery.appendChild(button);
      });

      renderPagination();
      history.replaceState(null, "", `#page=${currentPage + 1}`);

      if (shouldScroll) {
        document.querySelector(".page-head").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function openLightbox(file, caption) {
      lightboxImg.src = filePath(file, 1800);
      lightboxImg.alt = caption;
      lightboxText.innerHTML = `${caption} <a href="${filePage(file)}" target="_blank" rel="noopener">查看来源</a>`;
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
      closeBtn.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
      document.body.style.overflow = "";
    }

    closeBtn.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && lightbox.classList.contains("open")) {
        closeLightbox();
      }
      if (!lightbox.classList.contains("open") && event.key === "ArrowRight") {
        showPage(currentPage + 1, true);
      }
      if (!lightbox.classList.contains("open") && event.key === "ArrowLeft") {
        showPage(currentPage - 1, true);
      }
    });

    const hashMatch = window.location.hash.match(/page=(\d+)/);
    const initialPage = hashMatch ? Number(hashMatch[1]) - 1 : 0;
    showPage(initialPage);
  </script>
</body>
</html>
